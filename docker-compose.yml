#
# https://hub.docker.com/_/php
# https://hub.docker.com/r/postgis/postgis
#
services:
  sql:
    image: postgis/postgis:13-3.5
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: petitereine
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - 'petitereine-sql:/var/lib/postgresql/data'
    networks:
      - petitereine
networks:
  petitereine:
    driver: bridge
volumes:
  petitereine-sql:
    driver: local
